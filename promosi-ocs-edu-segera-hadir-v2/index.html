 const cta=out(p(t,14.6,15.2));pose('cta-note',{x:42*(1-cta),y:85*(1-cta),r:mix(8,-3,cta),o:cta});$('cta-text').style.clipPath=`inset(0 ${(100*(1-ease(p(t,14.95,16.1)))).toFixed(3)}% 0 0)`;
 $('paper-grain').style.transform=`translate(${(Math.sin(cycle)*6).toFixed(3)}px,${(Math.cos(cycle)*6).toFixed(3)}px)`;
 $('scrub').value=t.toFixed(2);$('clock').textContent=`${t.toFixed(2)} / 18`;
}
const clockState={time:0},intent={playing:false};let pendingPlay=null;
const tl=gsap.timeline({paused:true,onUpdate:()=>{if(intent.playing&&!music.paused&&Math.abs(clockState.time-music.currentTime)>.04)tl.time(Math.min(DURATION,music.currentTime),true);render(clockState.time)},onComplete:()=>{if(intent.playing){music.currentTime=0;tl.play(0);music.play().catch(pause)}}});tl.to(clockState,{time:DURATION,duration:DURATION,ease:'none'});
function pause(){intent.playing=false;tl.pause();music.pause()}
function seek(time){pause();const t=Math.max(0,Math.min(DURATION,Number(time)||0));tl.time(t,false);render(t);if(Number.isFinite(music.duration))music.currentTime=Math.min(t,music.duration)}
async function play(){if(pendingPlay)return pendingPlay;pendingPlay=(async()=>{if(clockState.time>=DURATION-.01){tl.time(0);music.currentTime=0}intent.playing=true;music.currentTime=clockState.time;try{await music.play();if(intent.playing)tl.play();else music.pause();return intent.playing}catch{pause();return false}})();try{return await pendingPlay}finally{pendingPlay=null}}
async function restart(){seek(0);return play()}
function fit(){$('stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/W,innerHeight/H)})`}addEventListener('resize',fit);fit();
$('stage').addEventListener('click',()=>intent.playing?pause():play());$('play').addEventListener('click',()=>intent.playing?pause():play());$('restart').addEventListener('click',restart);$('scrub').addEventListener('input',e=>seek(e.target.value));
document.addEventListener('keydown',e=>{if(e.target instanceof HTMLInputElement)return;if(e.code==='Space'){e.preventDefault();intent.playing?pause():play()}if(e.code==='KeyR')restart()});if(params.has('debug'))$('debug').style.display='flex';
window.OPENER={W,H,DURATION,tl,seek,play,pause,restart,ready:false};render(0);
const audioReady=new Promise((resolve,reject)=>{if(music.readyState>=1){resolve();return}music.addEventListener('loadedmetadata',resolve,{once:true});music.addEventListener('error',()=>reject(Error('Audio tidak dapat dimuat')),{once:true})});
Promise.all([document.fonts.ready,...[...document.images].map(i=>i.decode()),audioReady]).then(()=>{render(0);window.OPENER.ready=true;if(!params.has('clean')&&!params.has('debug'))play()}).catch(e=>{window.OPENER.error=e.message;console.error(e)});
})();
